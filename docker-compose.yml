# Local Postgres 16 for development. Start it with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mailbox
      POSTGRES_PASSWORD: mailbox
      POSTGRES_DB: mailbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, on the very first start, and create the test database.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata:
